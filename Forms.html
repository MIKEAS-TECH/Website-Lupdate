<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Registration Form</h2>

    <form>
      <ul><h3>Normal Text Answer:</h3>
       <li><label>Fullname:</label>
        <input type="text" name="fullname" placeholder="Enter your name" required></li>
        <br><br>
       <li><label>Phone Number</label>
        <input type="number"></li>
        <br><br>
         <li><label>Email</label>
        <input type="email" name="Email" placeholder="Enter your email" required></li>
        <br><br>
         <li><label>Password</label>
        <input type="password"></li>
      </ul>
       <ul><h3>RADIO BOTTON (Optional{one answer})</h3>
        <li><label><strong>Gender</strong></label>
        <input type="radio" name="Gender" value="male">
        <label>Male</label>
        <input type="radio" name="Gender" value="female">
        <label>female</label></li>
        <br><br>
        <li><label><h3>Nationality:</h3></label>
        <input type="radio" name="nationality" value="Nigeria">
        <label>Nigeria</label><br>
        <input type="radio" naame="nationality" value="Algeria">
        <label>Algeria</label><br>
        <input type="radio" name="nationality" value="morroco">
        <label>Morroco</label></li>
       </ul>
        
     <ul> <p><h3>CHECKBOXES (optional{single} and multiple options)</h3></p> 
       <li><label><strong>Programming Languages you know:</strong></label><br>
        <input type="checkbox" name="Languages" value="css">
        <label>css</label><br>
         <input type="checkbox" name="Languages" value="HTML">
            <label>HTML</label><br>
            <input type="checkbox" name="Languages" value="Python">
            <label>Python</label>
       </li>
    </ul>
       <ul>
        <h3>DROPDOWN</h3>
        <li><label><strong>Choose Your Department:</strong></label>
        </li><br>
        <select>
            <option>Computer Engineering</option>
            <option>Computer Science</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>CyberSecurity</option>
        </select>
            <label>
               <li><strong>Choose Your Level:</strong></li>
            </label><br>
            <select>
                <option>100lvl</option>
                <option>200lvl</option>
                <option>300lvl</option>
                <option>400lvl</option>
                <option>500lvl</option>
            </select>
       </ul>
       <h3>
        LARGER TEXT BOX
       </h3>
       <ul>
        <label>
            <strong><li>Additional Message:</li></strong>
        </label>
       </ul>
       <textarea rows="10" cols="35"></textarea>
       <h3>SUMMIT BOTTEN</h3>
       <button type="submit">submit</button>
       
       
    
    </form>
</body>
</html>
